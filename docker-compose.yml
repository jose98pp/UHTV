services:
  # Servidor de aplicaciones PHP-FPM y herramientas CLI (Composer, Artisan, Node)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uhtv_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=bd_noti
      - DB_USERNAME=uhtv_user
      - DB_PASSWORD=uhtv_secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - uhtv-network

  # Servidor Web Nginx de alto rendimiento
  web:
    image: nginx:1.27-alpine
    container_name: uhtv_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - uhtv-network

  # Base de Datos MySQL 8.0 con auto-importación inicial de datos
  db:
    image: mysql:8.0
    container_name: uhtv_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: bd_noti
      MYSQL_USER: uhtv_user
      MYSQL_PASSWORD: uhtv_secret
    ports:
      - "${FORWARD_DB_PORT:-33066}:3306"
    volumes:
      - uhtv_db_data:/var/lib/mysql
      - ./docker/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=64M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot_secret --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - uhtv-network

volumes:
  uhtv_db_data:
    driver: local

networks:
  uhtv-network:
    driver: bridge
